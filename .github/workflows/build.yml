# Build public sources with a hash-pinned, signed portable Python runtime.
# Verify source content, runtime identity and signatures before uploading artifacts.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check public repository files
        run: python tools/public_files.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests without game data
        # Game-data suites run locally because extracted GSC files are not public.
        run: python tests/run_ci.py

      - name: Download the hash-pinned baseline runtime
        shell: pwsh
        run: |
          $archive = "baseline.zip"
          Invoke-WebRequest -Uri "https://github.com/Zayn995/S2Tweaker/releases/download/v1.36.1/S2Tweaker_v1.36.1.zip" -OutFile $archive
          $expected = "0B2E9F1ECB6B95DA788D8DE72625C58F2784CEB1E4B00878EE81F518AFEB7CB8"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw "Baseline ZIP does not match 1.36.1" }
          Expand-Archive -LiteralPath $archive -DestinationPath baseline

      - name: Assemble current sources with the unchanged runtime
        run: python tools/refresh_portable.py --base baseline --output dist/S2Tweaker --expected-starter-sha D72294FB338BC2FC8896D25A7395A4DB466425427E1559E77185D5135A830681

      - name: Run the headless portable self-test
        shell: pwsh
        run: |
          $env:S2TWEAKER_SELFTEST = Join-Path $PWD "dist/selftest.txt"
          try {
            $process = Start-Process -FilePath (Join-Path $PWD "dist/S2Tweaker/S2Tweaker.exe") -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Portable self-test timed out" }
            Get-Content $env:S2TWEAKER_SELFTEST
            if ($process.ExitCode -ne 0) { throw "Portable self-test failed: $($process.ExitCode)" }
            if ((Get-Content $env:S2TWEAKER_SELFTEST -Tail 1) -ne "OK") { throw "Self-test did not complete" }
          } finally { Remove-Item Env:S2TWEAKER_SELFTEST -ErrorAction SilentlyContinue }

      - name: Verify signed launcher and absence of networking modules
        # Independently verify the pinned starter, all binary signatures and
        # the absence of networking modules in the portable directory.
        shell: pwsh
        run: |
          $dist = "dist/S2Tweaker"
          $exe = "$dist/S2Tweaker.exe"
          if (-not (Test-Path $exe)) { throw "EXE missing: $exe" }
          $py = "baseline/S2Tweaker.exe"
          $h1 = (Get-FileHash $exe -Algorithm SHA256).Hash
          $h2 = (Get-FileHash $py -Algorithm SHA256).Hash
          "S2Tweaker.exe : $h1"
          "1.36.1 starter: $h2"
          if ($h1 -ne $h2) { throw "S2Tweaker.exe is not the unchanged 1.36.1 launcher" }
          $sig = Get-AuthenticodeSignature $exe
          "Signature     : $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Python Software Foundation') {
            throw "Launcher does not have a valid Python Software Foundation signature"
          }
          $bins = Get-ChildItem $dist -Recurse -Include *.exe,*.dll,*.pyd
          $unsigned = @($bins | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' })
          "Binary files : $($bins.Count), unsigned: $($unsigned.Name -join ', ')"
          if ($unsigned.Count -gt 0) { throw "Unsigned binary in the package" }
          if (Get-ChildItem $dist -Recurse -Filter repak.exe) { throw "repak.exe in the package" }
          foreach ($bad in '_ssl', '_socket', '_hashlib', 'libssl', 'libcrypto', 'sqlite3', '_multiprocessing') {
            if (Get-ChildItem $dist -Recurse -Filter "$bad*") { throw "$bad* in the package" }
          }
          if (-not (Test-Path "$dist/_internal/sitecustomize.py")) { throw "Launcher module missing" }
          "Size          : $((Get-ChildItem $dist -Recurse -File | Measure-Object Length -Sum).Sum) Bytes"

      - name: Check public artifact files
        run: python tools/public_files.py dist/S2Tweaker

      - name: Upload verification reports
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            dist/runtime_integrity.json
            dist/selftest.txt
          if-no-files-found: error

      - name: Upload the portable application
        uses: actions/upload-artifact@v4
        with:
          name: S2Tweaker-${{ github.sha }}
          path: dist/S2Tweaker/
          if-no-files-found: error

      # Release ZIPs are built from the directory verified above, in this same
      # job, so nothing unverified can reach a release. Every other run only
      # proves the release path still works.
      - name: Check the release path still works
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python tools/make_release_zips.py 0.0.0-ci --dist dist/S2Tweaker

      - name: Check the tag against the version and its notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $version = (python -c "import s2tweaker; print(s2tweaker.__version__)").Trim()
          "tag: $tag / __version__: $version"
          if ($tag -ne $version) {
            throw "Tag v$tag does not match s2tweaker.__version__ $version"
          }
          if (-not (Test-Path "release/NOTES_v$version.md")) {
            throw "release/NOTES_v$version.md is missing"
          }

      - name: Build the release ZIPs
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          python tools/make_release_zips.py $version --dist dist/S2Tweaker

      - name: Upload the release ZIPs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: release/S2Tweaker_v*.zip
          if-no-files-found: error

  # A tag creates a DRAFT release with both ZIPs attached. Publishing stays a
  # deliberate click: a published release notifies watchers and cannot be taken
  # back cleanly, and a mistyped tag should not reach anyone.
  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Only this job writes; the build job stays read-only.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: release-zips

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="release/NOTES_v$version.md"
          player="release-zips/S2Tweaker_v$version.zip"
          source="release-zips/S2Tweaker_v${version}_source.zip"
          for file in "$notes" "$player" "$source"; do
            test -f "$file" || { echo "Missing: $file"; exit 1; }
          done
          # One source of truth for the title: the notes file's own heading.
          title="$(head -1 "$notes" | sed 's/^# *//')"
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "$title" --notes-file "$notes" "$player" "$source"
          echo "Draft release for $GITHUB_REF_NAME created. Review it, then publish."
